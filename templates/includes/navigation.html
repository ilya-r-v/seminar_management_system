{% load static %}
{% with namespace=request.resolver_match.namespace %}
<nav class="navbar navbar-expand-lg navbar-dark site-navbar mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'homepage:index' %}">
            <img
                src="{% static 'homepage/img/logo.png' %}"
                alt="Логотип"
                class="site-logo me-2"
            >
            Система управления семинарами
        </a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link {% if namespace == 'homepage' %}active{% endif %}"
                   href="{% url 'homepage:index' %}">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if namespace == 'seminars' %}active{% endif %}"
                   href="{% url 'seminars:list' %}">Семинары</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if namespace == 'registrations' %}active{% endif %}"
                   href="{% url 'registrations:list' %}">Регистрации</a>
            </li>
        </ul>
    </div>
</nav>
{% endwith %}
