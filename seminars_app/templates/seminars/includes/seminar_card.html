<article class="card seminar-card mb-3">
    <div class="card-body d-flex justify-content-between align-items-center">
        <div>
            <h2 class="h5 card-title mb-1">
                {{ item.seminar.title|default:"Без названия" }}
            </h2>
            <p class="card-text text-muted mb-2">
                Дата: {{ item.seminar.date|date:"d.m.Y" }}
            </p>
            <a href="{% url 'seminars:detail' item.seminar.id %}" class="btn btn-primary btn-sm">
                Подробнее
            </a>
        </div>
        <span class="badge seats-badge {% if item.is_full %}bg-danger{% else %}bg-success{% endif %}">
            {{ item.registered_count }} / {{ item.seminar.max_participants }}
        </span>
    </div>
</article>
